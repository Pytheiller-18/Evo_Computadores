<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Conceptual: Sistema de Computación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── TOOLBAR ─────────────────────────────────────────── */
        #toolbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 999px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover { background: #38bdf8; color: #0f172a; }
        .btn-purple { border-color: #a855f7; color: #c084fc; }
        .btn-purple:hover { background: #a855f7; color: #fff; }
        .separator { width: 1px; height: 22px; background: #334155; }

        /* ── LEGEND BADGE ─────────────────────────────────────── */
        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 16px;
            z-index: 1000;
            font-size: 11px;
            color: #94a3b8;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            line-height: 1.8;
        }
        #legend strong { color: #f8fafc; }
        #legend .legend-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 4px;
        }
        #legend .legend-row { display: flex; align-items: center; gap: 6px; }
        #legend .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        /* ── GESTURE HINTS ────────────────────────────────────── */
        #hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 16px;
            z-index: 1000;
            font-size: 11px;
            color: #64748b;
            line-height: 1.9;
        }
        #hint .hint-row { display: flex; align-items: center; gap: 8px; }
        #hint .icon { width: 22px; text-align: center; color: #38bdf8; font-size: 12px; }

        /* ── CANVAS ───────────────────────────────────────────── */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
            overflow: hidden;
            touch-action: none; /* disable browser default touch gestures */
        }
        #canvas-container.dragging { cursor: grabbing; }

        #map-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            padding: 120px 80px 120px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            min-width: max-content;
            gap: 0;
        }

        /* ── CONNECTOR LINES ──────────────────────────────────── */
        /* Vertical connector from parent node down to next level */
        .v-line {
            width: 2px;
            background: #334155;
            flex-shrink: 0;
        }

        /* ── NODES ────────────────────────────────────────────── */
        .node-root {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            color: white;
            padding: 14px 48px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 0 40px rgba(14,165,233,0.35), 0 8px 24px rgba(0,0,0,0.4);
            border: 2px solid rgba(186,230,253,0.4);
            text-align: center;
            letter-spacing: 0.04em;
            position: relative;
            z-index: 10;
        }

        .node-main-hw {
            background: #0c2233;
            border: 2px solid #38bdf8;
            color: #7dd3fc;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 0 20px rgba(56,189,248,0.2);
            position: relative;
            z-index: 10;
        }
        .node-main-sw {
            background: #1a0a2e;
            border: 2px solid #a855f7;
            color: #d8b4fe;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 0 20px rgba(168,85,247,0.2);
            position: relative;
            z-index: 10;
        }

        .node-subtitle {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.65;
            margin-top: 3px;
            letter-spacing: 0.02em;
        }

        .node-category {
            background: #0f172a;
            color: #f8fafc;
            padding: 7px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #334155;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }

        .relation-label {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            background: #0b0f19;
            border: 1px dashed #334155;
            padding: 2px 10px;
            border-radius: 999px;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        /* ── COMPONENT CARDS ──────────────────────────────────── */
        .component-card {
            background: #1e293b;
            border-left: 4px solid;
            padding: 11px 13px;
            border-radius: 0 8px 8px 0;
            width: 255px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
            flex-shrink: 0;
        }
        .component-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .component-card .card-title {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.3;
        }
        .component-card .card-clasif {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 3px;
            margin-bottom: 6px;
            display: block;
        }
        .component-card .card-f {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.45;
            margin-bottom: 3px;
        }
        .component-card .card-r {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.45;
        }
        .card-lf { font-weight: 700; color: #f8fafc; }

        /* ── TREE LAYOUT HELPERS ──────────────────────────────── */
        .level-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 0;
        }

        /* Column: vertical group of things */
        .col { display: flex; flex-direction: column; align-items: center; }

        /* Horizontal bar that spans children + connectors */
        .h-bar {
            height: 2px;
            background: #334155;
            align-self: flex-start;
        }

        /* Branch column inside a category */
        .branch-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cards column inside a branch */
        .cards-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 0;
        }

        /* Sub-group label inside categories (Periféricos) */
        .sub-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #475569;
            margin-bottom: 6px;
            margin-top: 10px;
        }
    </style>
</head>

<div id="toolbar">

<!-- ══ LEGEND ════════════════════════════════════════════════════════════ -->
<div id="legend">

        <div class="legend-row"><span class="dot" style="background:#a855f7"></span>&nbsp;Software — Soporte Lógico</div>
    </div>
</div>

<!-- ══ GESTURE HINTS ════════════════════════════════════════════════════ -->
<div id="hint">
    <div class="hint-row"><span class="icon"><i class="fas fa-hand-paper"></i></span> Clic + arrastrar → mover mapa</div>
    <div class="hint-row"><span class="icon"><i class="fas fa-arrows-alt"></i></span> 2 dedos deslizar → mover mapa</div>
    <div class="hint-row"><span class="icon"><i class="fas fa-search-plus"></i></span> Gesto Pinch → zoom in/out</div>
    <div class="hint-row"><span class="icon"><i class="fas fa-mouse"></i></span> Ctrl + rueda → zoom in/out</div>
</div>

<!-- ══ CANVAS ════════════════════════════════════════════════════════════ -->
<div id="canvas-container">
    <div id="map-wrapper">
        <!-- Will be built by JS -->
    </div>
</div>

                ]

    }
};

/* ═══════════════════════════════════════════════════
   BUILD MAP HTML
═══════════════════════════════════════════════════ */
function buildCard(node, color) {
    return `
        <div class="component-card" style="border-color: ${color};">
            <div class="card-title">${node.name}</div>
            <span class="card-clasif" style="color:${color}">${node.clasif}</span>
            <div class="card-f"><span class="card-lf">F:</span> ${node.func}</div>
            <div class="card-r"><span class="card-lf">R:</span> ${node.rel}</div>
        </div>`;
}

function buildCategoryBlock(cat) {
    let cardsHTML = '';

    if (cat.subgroups) {
        cat.subgroups.forEach(sg => {
            cardsHTML += `<div class="sub-label">${sg.subLabel}</div>`;
            sg.nodes.forEach(n => { cardsHTML += buildCard(n, cat.color); });
        });
    } else {
        cat.nodes.forEach(n => { cardsHTML += buildCard(n, cat.color); });
    }

    return `
        <div class="branch-col" style="margin: 0 14px; align-items: center;">
            <!-- relation label -->
            <div class="relation-label" style="margin-bottom:6px;">${cat.relation}</div>
            <!-- category header -->
            <div class="node-category" style="border-color:${cat.color}; color:${cat.color}; margin-bottom:10px;">${cat.label}</div>
            <!-- cards -->
            <div class="cards-col" style="padding:0 4px;">
                ${cardsHTML}
            </div>
        </div>`;
}

function buildBranchGroup(branch) {
    const categoryCols = branch.categories.map(buildCategoryBlock).join('');
    return `
        <div class="col" style="align-items:center;">
            <!-- MAIN NODE (HW/SW) -->
            <div class="${branch.bgClass}">
                ${branch.label}
                <div class="node-subtitle">${branch.subtitle}</div>
            </div>
            <!-- Vertical connector -->
            <div class="v-line" style="height:30px;"></div>
            <!-- Categories in a row -->
            <div style="display:flex; align-items:flex-start; justify-content:center; gap:0; position:relative;">
                <!-- Horizontal bar spanning all categories -->
                <div style="position:absolute; top:0; left:14px; right:14px; height:2px; background:#334155;"></div>
                ${categoryCols}
            </div>
        </div>`;
}

function buildMap() {
    const wrapper = document.getElementById('map-wrapper');

    // Root node
    const rootHTML = `
        <div class="col" style="align-items:center; gap:0;">
            <div class="node-root">SISTEMA DE COMPUTACIÓN</div>
            <div class="v-line" style="height:30px;"></div>
            <!-- "se compone de" label -->
            <div class="relation-label" style="margin-bottom:4px;">se compone de</div>
            <div class="v-line" style="height:20px;"></div>
            <!-- Horizontal split bar -->
            <div style="display:flex; align-items:flex-start; gap:80px; position:relative;">
                <!-- Spanning bar -->
                <div style="position:absolute; top:0; left:0; right:0; height:2px; background:#334155;"></div>
                ${buildBranchGroup(mapData.hardware)}
                ${buildBranchGroup(mapData.software)}
            </div>
        </div>`;

    wrapper.innerHTML = rootHTML;
}

/* ═══════════════════════════════════════════════════
   PAN & ZOOM ENGINE
   - 2-finger swipe on trackpad → PAN  (no zoom)
   - Pinch gesture on trackpad  → ZOOM
   - Ctrl + wheel                → ZOOM
   - Left-click drag             → PAN
   - Touch (mobile): 1 finger   → PAN, 2 fingers → ZOOM
═══════════════════════════════════════════════════ */
const container = document.getElementById('canvas-container');
const wrapper   = document.getElementById('map-wrapper');

let scale      = 0.75;
let tx         = 0;
let ty         = 0;
let isDragging = false;
let startX, startY;

// Last pinch distance for touch
let lastPinchDist = null;

function applyTransform() {
    wrapper.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

// Zoom centred on the viewport centre (or a given focal point)
function zoomAt(delta, focalX, focalY) {
    const prevScale = scale;
    scale = Math.min(2.5, Math.max(0.18, scale + delta));

    // Adjust translation so the focal point stays fixed
    if (focalX !== undefined && focalY !== undefined) {
        tx = focalX - (focalX - tx) * (scale / prevScale);
        ty = focalY - (focalY - ty) * (scale / prevScale);
    }
    applyTransform();
}

function resetView() {
    scale = 0.75;
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const ww = wrapper.scrollWidth  * scale;
    const wh = wrapper.scrollHeight * scale;
    tx = (cw - ww) / 2;
    ty = Math.max(60, (ch - wh) / 2);
    applyTransform();
}

/* ── Mouse drag ─────────────────────────── */
container.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDragging = true;
    startX = e.clientX - tx;
    startY = e.clientY - ty;
    container.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    tx = e.clientX - startX;
    ty = e.clientY - startY;
    applyTransform();
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    container.classList.remove('dragging');
});

/* ── Wheel / Trackpad ───────────────────────────────────────────────────
   Modern trackpads fire wheel events.
   - Pinch gesture  → e.ctrlKey = true  (browser sets this) → ZOOM
   - 2-finger pan   → e.ctrlKey = false                     → PAN
   - Mouse wheel    → ctrlKey false by default              → PAN vertical
     (User can Ctrl+wheel to zoom with a mouse too)
──────────────────────────────────────────────────────────────────────── */
container.addEventListener('wheel', e => {
    e.preventDefault();

    if (e.ctrlKey) {
        // PINCH or Ctrl+wheel → ZOOM centred on cursor
        const delta = e.deltaY * -0.008;
        zoomAt(delta, e.clientX, e.clientY);
    } else {
        // 2-finger pan or regular scroll → PAN
        tx -= e.deltaX;
        ty -= e.deltaY;
        applyTransform();
    }
}, { passive: false });

/* ── Touch (mobile / tablet) ────────────────────────────────────────── */
let touch1 = null, touch2 = null;

function getTouches(e) {
    return Array.from(e.touches);
}

function pinchDist(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
}

container.addEventListener('touchstart', e => {
    const touches = getTouches(e);
    if (touches.length === 1) {
        isDragging = true;
        startX = touches[0].clientX - tx;
        startY = touches[0].clientY - ty;
        lastPinchDist = null;
    } else if (touches.length === 2) {
        isDragging = false;
        lastPinchDist = pinchDist(touches);
    }
}, { passive: true });

container.addEventListener('touchmove', e => {
    e.preventDefault();
    const touches = getTouches(e);

    if (touches.length === 1 && isDragging) {
        tx = touches[0].clientX - startX;
        ty = touches[0].clientY - startY;
        applyTransform();
    } else if (touches.length === 2) {
        const dist = pinchDist(touches);
        if (lastPinchDist !== null) {
            const delta = (dist - lastPinchDist) * 0.008;
            // Focal point = midpoint of two fingers
            const fx = (touches[0].clientX + touches[1].clientX) / 2;
            const fy = (touches[0].clientY + touches[1].clientY) / 2;
            zoomAt(delta, fx, fy);
        }
        lastPinchDist = dist;
    }
}, { passive: false });

container.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
        isDragging = false;
        lastPinchDist = null;
    } else if (e.touches.length === 1) {
        lastPinchDist = null;
        // Resume single-finger pan
        isDragging = true;
        startX = e.touches[0].clientX - tx;
        startY = e.touches[0].clientY - ty;
    }
}, { passive: true });

/* ── Init ───────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    buildMap();
    // Give the layout a frame to settle then centre
    requestAnimationFrame(() => {
        requestAnimationFrame(resetView);
    });
});
</script>
